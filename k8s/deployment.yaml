apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: ghcr.io/pabasarameegahakumbura/todo-app--leraning:0cd6962dfb62460859ab92428b73d76cd3a46611
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: todo-storage
              mountPath: /etc/todos
          startupProbe:
            httpGet:
              path: /api/greeting
              port: 3000
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/greeting
              port: 3000
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/greeting
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

      volumes:
        - name: todo-storage
          persistentVolumeClaim:
            claimName: todo-data